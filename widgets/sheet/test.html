import * as M from './model.js';
const Core = window.SheetCore;

// Build a workbook from a grid of raw values
function mk(name, grid) {
  const sh = Core.newSheet(name, 60, 12);
  grid.forEach((row, r) => row.forEach((v, c) => { if (v !== null && v !== undefined && v !== '') sh.cells[sh.rows[r] + ':' + sh.cols[c]] = { v: String(v) }; }));
  return sh;
}
const s1 = mk('Sheet1', [
  ['Item', 'Qty', 'Price', 'Date', 'Cat'],
  ['Laptop', 3, 1250.5, 46000, 'A'],
  ['Monitor', 5, 320, 46010, 'B'],
  ['Keyboard', 12, 45.9, 46020, 'A'],
  ['Mouse', 20, 19.99, 46030, 'C'],
  ['Cable', '', 5, 46040, 'B']
]);
const s2 = mk('Data 2', [[10, 20], [30, 40]]);
const doc = { sheets: [s1, s2], names: { RATE: '=0.18', PRICES: "=Sheet1!$C$2:$C$6" } };
doc.sheets.forEach((s) => { s.tables = []; });
s1.tables.push({ id: 't1', name: 'Sales', r1: s1.rows[0], c1: s1.cols[0], r2: s1.rows[5], c2: s1.cols[4], header: true });
const book = {
  sheets: doc.sheets, names: doc.names,
  findTable: (n) => M.findTable(engine, doc, n, 1, 'en-US'),
  tableAt: (sh, r, c) => M.tableAt(engine, sh, r, c, 1, 'en-US'),
  hidden: {},          // "sheetId|r" → 'manual' | 'filter' (set by the tests)
  rowHidden(sh, r) { return this.hidden[sh.id + '|' + r] || null; }
};
const engine = new Engine(book, 'en-US');

const results = [];
function ev(f, at = [20, 8]) {
  // write the formula into a free cell and read it back
  const k = s1.rows[at[0]] + ':' + s1.cols[at[1]];
  s1.cells[k] = { v: f };
  engine.invalidate();
  const v = engine.valueAt(s1, at[0], at[1]);
  delete s1.cells[k];
  return v;
}
function eq(f, expected, tol = 1e-9) {
  const v = ev(f);
  let ok;
  if (typeof expected === 'number' && typeof v === 'number') ok = Math.abs(v - expected) <= tol * Math.max(1, Math.abs(expected));
  else if (typeof expected === 'string' && expected[0] === '#') ok = isErr(v) && v.code === expected;
  else ok = JSON.stringify(v) === JSON.stringify(expected);
  results.push({ ok, f, v: isErr(v) ? v.code : v, expected });
}
const t = (name, fn) => { try { fn(); } catch (e) { results.push({ ok: false, f: name, v: 'threw ' + e.message, expected: '' }); } };

  delete s1.cells[k]; delete s1.cells[s1.rows[35] + ':' + s1.cols[0]]; delete s1.cells[s1.rows[31] + ':' + s1.cols[1]];
});

t('rewriting', () => {
  const chk = (got, exp, label) => results.push({ ok: got === exp, f: label, v: got, expected: exp });
  chk(translateFormula('=A1+$B$2+C$3+$D4', 2, 1), '=B3+$B$2+D$3+$D6', 'translate');
  chk(translateFormula('=A1', -1, 0), '=#REF!', 'translate off sheet');
  chk(shiftFormula('=SUM(A1:A10)+B5', 'r', 4, 2, () => true), '=SUM(A1:A12)+B7', 'insert rows');
  chk(shiftFormula('=SUM(A1:A10)+B5', 'r', 4, -1, () => true), '=SUM(A1:A9)+#REF!', 'delete row 5');
  chk(shiftFormula('=C1+SUM(A:C)', 'c', 1, 1, () => true), '=D1+SUM(A:D)', 'insert column');
  chk(renameSheetInFormula("=Sheet1!A1+'Data 2'!B2", 'Data 2', 'Totals'), '=Sheet1!A1+Totals!B2', 'rename sheet');

});
t('input parsing', () => {

  chk('3,5', 'tr-TR', '3.5'); chk('1.234,5', 'tr-TR', '1234.5', 'num'); chk('1,234.5', 'en-US', '1234.5', 'num'); chk('12%', 'en-US', '0.12', 'pct');
  chk('17.11.2026', 'tr-TR', '46343', 'date'); chk('11/17/2026', 'en-US', '46343', 'date'); chk('2026-11-17', 'en-US', '46343', 'date');

  fv(9.95, { nf: 'sci', dp: 15 }, 'en-US', '9.950000000000000E+0'); fv(-0.07, { nf: 'sci', dp: 15 }, 'tr-TR', '-7,000000000000000E-2');
  fv(9.95, { nf: 'sci', dp: 14 }, 'en-US', '9.95000000000000E+0'); fv(1234.5, { nf: 'sci', dp: 2 }, 'en-US', '1.23E+3'); fv(0, { nf: 'sci', dp: 15 }, 'en-US', '0.000000000000000E+0');
  fv(9.95, { nf: 'num', dp: 15 }, 'en-US', '9.950000000000000');

t('formula separators', () => {
  const pairs = [
    ['=ROUND(1.5,0)', '=ROUND(1,5;0)'],
    ['=SUMPRODUCT($C$1:$D$1,C5:D5)', '=SUMPRODUCT($C$1:$D$1;C5:D5)'],
    ['=IF(A1>0.5,"a,b;c",\'Data 2\'!A1)', '=IF(A1>0,5;"a,b;c";\'Data 2\'!A1)'],
    ['=SUM({1,2;3,4})+STDEV.S(B1:B3)', '=SUM({1,2;3,4})+STDEV.S(B1:B3)'],
    ['=SUM(Sales[Qty],1.25)', '=SUM(Sales[Qty];1,25)'],
    ['=A1*1E+3', '=A1*1E+3']
  ];
  for (const [stored, local] of pairs) {
    const shown = formulaToLocal(stored, 'semicolon');
    results.push({ ok: shown === local, f: 'to local ' + stored, v: shown, expected: local });
    const back = formulaFromLocal(local, 'semicolon');
    results.push({ ok: back === stored, f: 'from local ' + local, v: back, expected: stored });
  }
  // typed with commas in semicolon style: kept as separators, except a decimal comma after a number
  const t1 = formulaFromLocal('=SUM(A1,B1)', 'semicolon');
  results.push({ ok: t1 === '=SUM(A1,B1)', f: 'comma after a reference stays a separator', v: t1, expected: '=SUM(A1,B1)' });
  const t2 = formulaToLocal('=SUM(A1;B1)', 'comma');
  results.push({ ok: t2 === '=SUM(A1,B1)', f: 'comma style shows commas', v: t2, expected: '=SUM(A1,B1)' });
  results.push({ ok: separatorStyle('auto', 'tr-TR') === 'semicolon' && separatorStyle('auto', 'en-US') === 'comma' && separatorStyle('comma', 'tr-TR') === 'comma', f: 'separator style by language', v: separatorStyle('auto', 'tr-TR'), expected: 'semicolon' });
  results.push({ ok: helpToLocal('ROUND(number, digits)', 'semicolon') === 'ROUND(number; digits)', f: 'help in semicolon style', v: helpToLocal('ROUND(number, digits)', 'semicolon'), expected: 'ROUND(number; digits)' });
  // the stored form evaluates as typed in the local style
  const v = ev(formulaFromLocal('=ROUND(1,5;0)+SUM(1,25;2)', 'semicolon'));
  results.push({ ok: v === 5.25, f: 'local formula evaluates', v, expected: 5.25 });
});

t('several ranges: copy, paste, cut, format', () => {
  const chk = (got, exp, label) => results.push({ ok: JSON.stringify(got) === JSON.stringify(exp), f: 'ranges: ' + label, v: JSON.stringify(got), expected: JSON.stringify(exp) });
  // which cells a copy of several ranges takes (as in Excel)
  chk(M.copyLines([{ r1: 0, c1: 0, r2: 2, c2: 0 }, { r1: 0, c1: 3, r2: 2, c2: 4 }]), { rows: [0, 1, 2], cols: [0, 3, 4] }, 'columns over the same rows copy side by side');
  chk(M.copyLines([{ r1: 5, c1: 1, r2: 5, c2: 2 }, { r1: 1, c1: 1, r2: 2, c2: 2 }]), { rows: [1, 2, 5], cols: [1, 2] }, 'rows over the same columns copy in sheet order');

// ---------------------------------------------------------------- 1.2.6 regressions found in review (round 2)
/** A workbook of its own: cells as { A1: raw } on sheet "Calc", optional names and one table { name, from, to }. */
function book2(cells, opts = {}) {
  const sh = Core.newSheet('Calc', opts.rows || 20, opts.cols || 10);
  for (const [a, v] of Object.entries(cells)) { const p = parseAddr(a); sh.cells[sh.rows[p.r] + ':' + sh.cols[p.c]] = { v: String(v) }; }
  if (opts.table) {
    const p1 = parseAddr(opts.table.from), p2 = parseAddr(opts.table.to);
    sh.tables = [{ id: 'r2', name: opts.table.name, r1: sh.rows[p1.r], c1: sh.cols[p1.c], r2: sh.rows[p2.r], c2: sh.cols[p2.c], header: true }];
  }
  const d = { sheets: [sh], names: opts.names || {} };
  // opts.filtered: table filters hide rows for SUBTOTAL, kept once computed as the widget does (app.js rowHidden)
  let rowsHidden = null;
  const rowHidden = (s, r) => {
    let rows = rowsHidden;
    if (!rows) { rows = M.filteredRows(eng, s, 1, 'en-US'); if (!budgetSpent()) rowsHidden = rows; }
    return rows.has(r) ? 'filter' : rows.unknown && rows.unknown.has(r) ? 'unknown' : null;
  };
  const eng = new Engine({ sheets: d.sheets, names: d.names, findTable: (n) => M.findTable(eng, d, n, 1, 'en-US'), tableAt: (s, r, c) => M.tableAt(eng, s, r, c, 1, 'en-US'), rowHidden: opts.filtered ? rowHidden : undefined }, 'en-US');
  const at = (a) => { const p = parseAddr(a); return eng.valueAt(sh, p.r, p.c); };
  const set = (a, v) => { const p = parseAddr(a); sh.cells[sh.rows[p.r] + ':' + sh.cols[p.c]] = { v: String(v) }; };
  // every cell row by row, as the grid draws them
  const draw = () => { for (let r = 0; r < sh.rows.length; r++) for (let c = 0; c < sh.cols.length; c++) eng.valueAt(sh, r, c); };
  return { sh, eng, at, set, draw };
}
/** A value as these tests compare it: errors by code, " (slow)" for the #CALC! of the work budget, numbers rounded. */
const shown = (v) => (isErr(v) ? v.code + (isSlowCalc(v) ? ' (slow)' : '') : typeof v === 'number' ? +v.toPrecision(12) : v);
const same = (label, got, exp) => results.push({ ok: JSON.stringify(got) === JSON.stringify(exp), f: label, v: got, expected: exp });
/** Waits for the next burst: the work budget is whole again, computed values stay. */
const burst = () => new Promise((r) => setTimeout(r, 0));
/** Draws in new bursts as the widget does (app.js continueCalc): again while a draw used up the budget and kept more
 * values than the one before, at most 20 times. Returns the number of draws. */
async function rounds(g, drawOnce = g.draw) {
  let kept = -1;
  for (let n = 1; ; n++) {
    await burst();
    drawOnce();
    const now = g.eng.progress();
    if (!budgetSpent() || now <= kept || n > 20) return n;
    kept = now;
  }
}

// the work budget (3e7 steps per burst): MDETERM of a zero matrix counts n^3 / 4 steps and returns at once

  // and the next burst computes the formulas after it
  let g = book2({ A1: 'Heavy', B1: HEAVY, A2: 'Item', B2: 'Qty', A3: 'Pen', B3: '12', C3: '=B3*2', A4: 'Ink', B4: '7', C4: '=B4*2', A5: '2026-11-25', B5: 'TRUE' });

    ['#CALC! (slow)', true, 'Pen', 12, '2026-11-25', true, '#CALC! (slow)']);
  await burst();
  g.draw();

  g = book2({ A1: 'Heavy', B1: HEAVY, B3: '12', C3: '=B3*2' });

  same('budget: draws as the widget does', [n2, drawn], [2, 24]);

  // two formulas too heavy behind a conditional formatting formula that takes more than half a burst: its result is
  // kept (evalAt with keep), so each later draw starts the next formula too heavy with the whole budget and keeps it as
  // #CALC!; the draws do not stop before the formulas after them

  // many formulas kept as #CALC! that may spill, read one by one: each read stays quick
  {
    const cells = { Z1: HEAVY, Y1: '=COUNTA(B1:B20000)' };
    for (let r = 1; r <= 20000; r++) cells['A' + r] = '=IF($Z$1=0,SEQUENCE(1),0)';
    g = book2(cells, { rows: 20000, cols: 26 });
    await burst();
    g.at('Z1');
    let t = 0, y1;
    for (let n = 0; n < 10; n++) { await burst(); const t0 = performance.now(); y1 = g.at('Y1'); t += performance.now() - t0; if (!budgetSpent()) break; }
    same('budget: many spill formulas kept as #CALC!', [shown(y1), t < 1500], ['#CALC! (slow)', true]);
  }

  // time wasted on a formula the budget stops counts from the last formula computed, also when the stopped one computed
  // a formula it reads first (the drawing's limit on wasted time must not be dodged that way)
  {
    const cells = { B1: '=ROW()', A1: '=SUM(B1)+' + HEAVY.slice(1) };
    g = book2(cells, { rows: 5 });
    await burst();
    const w0 = g.eng.wasted();
    const t0 = performance.now(); g.at('A1'); const dt = performance.now() - t0;
    same('budget: waste after a formula computed first', [shown(g.at('B1')), g.eng.wasted() - w0 > 0, g.eng.wasted() - w0 <= dt + 1], [1, true, true]);
  }

  // a defined name that depends on the cell through another name is not taken for one that gives the same everywhere
  {
    const cells = {};
    for (let r = 1; r <= 10; r++) cells['C' + r] = '=NNAME';
    g = book2(cells, { rows: 12, names: { RTWICE: '=ROW()*2', NNAME: '=IF(RTWICE=10,MDETERM(SEQUENCE(500,500,0,0)),RTWICE)' } });
    await rounds(g);
    same('budget: a name that depends on the cell through another name', ['C1', 'C4', 'C5', 'C6', 'C10'].map((a) => shown(g.at(a))), [2, 8, '#CALC! (slow)', 12, 20]);
  }

  // a formula too heavy in every cell that depends on the position is found too heavy for all of them after a few cells
  {
    const cells = {};
    for (let r = 1; r <= 30; r++) cells['A' + r] = '=HN';
    cells.C1 = '=1+1';
    g = book2(cells, { rows: 40, names: { HN: '=MDETERM(SEQUENCE(500,500,0,0))+ROW()' } });
    const nHN = await rounds(g);
    same('budget: a name too heavy everywhere that depends on the cell', [nHN <= 5, shown(g.at('A1')), shown(g.at('A30')), shown(g.at('C1'))], [true, '#CALC! (slow)', '#CALC! (slow)', 2]);
  }

  // functions that give one value are not taken for arrays that could spill over the cells next to them
  {
    g = book2({ A1: '=ROW()+' + HEAVY.slice(1), C1: '=COUNTA(A2:A5)', D1: '=PERCENTILE.INC(B1:B3,0.5)+' + HEAVY.slice(1), D2: '=E2+1' }, { rows: 8, cols: 6 });
    await rounds(g);
    same('budget: one-value formulas too heavy do not spill', ['A1', 'C1', 'D1', 'D2'].map((a) => shown(g.at(a))), ['#CALC! (slow)', 0, '#CALC! (slow)', 1]);
  }

  // a rule or name too heavy in one row only, used in several columns of that row: only that row is not computed (three
  // heavy cells in a row do not make it too heavy everywhere once it was computed somewhere)
  {
    const cells = {};
    for (let r = 1; r <= 12; r++) { cells['A' + r] = '=RN+0'; cells['B' + r] = '=RN+1'; cells['C' + r] = '=RN+2'; cells['E' + r] = String(r); }
    g = book2(cells, { rows: 14, cols: 8, names: { RN: '=IF(ROW()=5,MDETERM(SEQUENCE(500,500,0,0)),ROW()*10)' } });
    await rounds(g);
    same('budget: a name too heavy in one row, used three times in it', ['A4', 'C4', 'A5', 'C5', 'A6', 'C12'].map((a) => shown(g.at(a))), [40, 42, '#CALC! (slow)', '#CALC! (slow)', 60, 122]);
    const id = (a) => { const p = parseAddr(a); return [g.sh.rows[p.r], g.sh.cols[p.c]]; };
    const [f1r, f1c] = id('F1'), [h10r, h10c] = id('H10');
    g.sh.cf = [{ id: 'cfrow', r1: f1r, c1: f1c, r2: h10r, c2: h10c, type: 'formula', formula: '=IF($E1=5,MDETERM(SEQUENCE(500,500,0,0)),$E1)>3', style: { bg: '#f4cccc' } }];
    const cache = new Map();
    const row = (r) => [5, 6, 7].map((c) => (M.cfFor(g.eng, g.sh, r, c, M.indexOf(g.sh, 1), cache) ? 1 : 0)).join('');
    let marks = '';
    for (let n = 0; n < 10; n++) { await burst(); marks = [0, 3, 4, 5, 9].map(row).join(' '); if (!budgetSpent()) break; }
    same('budget: conditional formatting too heavy in one row of three columns', marks, '000 111 000 111 111');
  }

  // a defined name is evaluated on the sheet of the cell that uses it: too heavy on one sheet, it is computed on another
  {
    const one = Core.newSheet('One', 4, 4), two = Core.newSheet('Two', 4, 4);
    const put = (sh, a, v) => { const p = parseAddr(a); sh.cells[sh.rows[p.r] + ':' + sh.cols[p.c]] = { v }; };
    put(one, 'A1', '5'); put(one, 'B1', '=NQ'); put(two, 'A1', '3'); put(two, 'B1', '=NQ');
    const eng = new Engine({ sheets: [one, two], names: { NQ: '=IF($A$1=5,MDETERM(SEQUENCE(500,500,0,0)),$A$1)' } }, 'en-US');
    let a = null, b = null;
    for (let n = 0; n < 6; n++) { await burst(); a = eng.valueAt(one, 0, 1); b = eng.valueAt(two, 0, 1); if (!budgetSpent()) break; }

  // whatever is read first, and one next to such a spill too heavy to compute is not known
  {

    const first = shown(g.at('C2'));
    same('spill: MATCH of several values, read from a cell it covers first', [first, shown(g.at('B2'))], [3, 2]);
    g = book2({ A10: '5', A11: '1', A12: '3', A13: '9', A14: '7', C2: '=B2+1', C3: '=COUNTA(B2:B3)', B1: '=MATCH(A10:A12,A10:A14,0)+0*SUMPRODUCT(MDETERM(SEQUENCE(500,500,0,0)))' }, { rows: 16, cols: 4 });
    await rounds(g);
    same('budget: a MATCH spill too heavy', ['B1', 'C2', 'C3'].map((a) => shown(g.at(a))), ['#CALC! (slow)', '#CALC! (slow)', '#CALC! (slow)']);
  }

  // the clock: on a page in front, a formula that it stops with the whole budget is kept as too heavy at once; on a
  // page in the background (slower) it is not, and is computed when the page is in front again
  const realNow = Date.now;
  let skew = 0, slowClock = false;

  const hide = (on) => { if (on) Object.defineProperty(document, 'hidden', { configurable: true, get: () => true }); else delete document.hidden; };
  try {

    g.eng.invalidate();

    g = book2(clocked, { rows: 410 });
    await burst();
    let hiddenRun;

  g = book2({ A1: '=FILTER({1;2;3},{1;2;3}>5)', A2: '=UNIQUE(FILTER({1;2},{0;0}))', A3: '#CALC!', A4: "'#CALC!" });

  same('budget: isSlowCalc of empty results', ['A1', 'A2', 'A3'].map((a) => isSlowCalc(g.at(a))), [false, false, false]);

  // conditional formatting and validation formulas: a formula too heavy is #CALC! and is not computed again
  g = book2({ A1: '5' });
  await burst();
  const cf1 = shown(g.eng.evalAt(HEAVY + '>0', g.sh, 0, 0));
  await burst();
  const t0 = performance.now(), cf2 = shown(g.eng.evalAt(HEAVY + '>0', g.sh, 0, 0)), cfMs = performance.now() - t0;

} catch (e) { results.push({ ok: false, f: 'work budget tests', v: 'threw ' + e.message + ' ' + e.stack, expected: '' }); }

t('regular expressions: case-insensitive classes and flag groups match as JavaScript', () => {

  eq('=REGEXEXTRACT("kısa yol","[\\w]+",0,1)', 'k'); eq('=ROWS(REGEXEXTRACT("kısa yol","[\\w]+",1,1))', 3);
  eq('=REGEXTEST("\u00B5","[\u03BC]",1)', true); eq('=REGEXTEST("ϑ","[Θ]",1)', true); eq('=REGEXTEST("ǆ","[ǅ]",1)', true);
  eq('=REGEXTEST("\u212A","[k]",1)', false); eq('=REGEXTEST("\u017F","[s]",1)', false); eq('=REGEXTEST("ABC","[^a-c]",1)', false);
  // flag groups: (?i:…), (?-i:…), (?s:…), (?m:…)
  eq('=REGEXTEST("xABC","(?i:abc)")', true); eq('=REGEXEXTRACT("xAbC","x(?i:ab)C")', 'xAbC'); eq('=REGEXTEST("xAbc","x(?i:ab)C")', false);
  eq('=REGEXTEST("Abc","(?-i:a)bc",1)', false); eq('=REGEXTEST("aBC","(?-i:a)bc",1)', true); eq('=REGEXEXTRACT("ABab","(?i:a(?-i:b))")', 'ab');
  eq('=REGEXTEST("a"&CHAR(10)&"b","(?s:a.b)")', true); eq('=REGEXTEST("a"&CHAR(10)&"b","a.b")', false);
  eq('=REGEXEXTRACT("x"&CHAR(10)&"b","(?m:^b)")', 'b'); eq('=REGEXTEST("a"&CHAR(10)&"b","(?m:a$)")', true); eq('=REGEXTEST("a"&CHAR(10)&"b","a$")', false);
  for (const p of ['(?-:a)', '(?ii:a)', '(?i-i:a)', '(?i)abc', '(?x:a)', '(?i:a', '(?<=a)b', 'a{2,1}', 'a{30000}']) eq('=REGEXTEST("a","' + p + '")', '#VALUE!');
  // counts over 1000, as long as the pattern stays small enough to run
  eq('=REGEXTEST(REPT("a",1001),"^a{1001}$")', true); eq('=REGEXTEST(REPT("a",1000),"a{1001}")', false); eq('=REGEXTEST(REPT("a",1200),"^a{1000,}$")', true);
  eq('=LEN(REGEXEXTRACT(REPT("ab",3000),"^(?:ab){3000}$"))', 6000);
  quick('(?:){1000000000} costs nothing', () => ev('=REGEXTEST("x","(?:){1000000000}x")') === true);
  // the same matches as JavaScript
  const g = book2({ C1: '=REGEXEXTRACT(A1,B1,0,0)', C2: '=REGEXEXTRACT(A1,B1,0,1)' });
  const jsMatch = (t, p, cs) => { let re; try { re = new RegExp(p, cs ? 'i' : ''); } catch (e) { return '#VALUE!'; } const m = re.exec(t); return m ? m[0] : '#N/A'; };
  const LS = String.fromCharCode(0x2028), PS = String.fromCharCode(0x2029);
  const cases = [['xABC', '(?i:abc)'], ['xAbC', 'x(?i:ab)C'], ['ABC', '(?-i:A)bc'], ['Abc', '(?-i:a)bc'], ['a\nb', '(?s:a.b)'], ['a\rb', '(?s:a.b)'],
    ['x\nb', '(?m:^b)'], ['a' + LS + 'b', '(?m:^b)'], ['a' + PS, '(?m:a$)'], ['A\nB', '(?im:^b$)'], ['aAaA', '(?i:a)+'], ['aAAb', '(?i:a){2}b'],
    ['AbAB', '(?i-s:ab)'], ['aB', '(?i-:ab)'], ['A\nb', '(?i-m:a$)'], ['ıI', '(?i:[A-Z]+)'], ['Σσς', '(?i:[σ]+)'], ['a\n', '(?m:$)'], ['', '(?m:^$)'],
    ['çğıöşü ÇĞİÖŞÜ', '[^\\x00-\\x7F]+'], ['kısa yol', '[\\w]+'], ['ǄǅǆΣσς', '[ǅ]+'], ['Straße', '[ß]'], ['ΣΑΣ', '[^σ]'], ['xy', '(){5}x'], ['ab', '(?-:a)']];
  const bad = [];
  for (const [t, p] of cases) {
    g.set('A1', "'" + t); g.set('B1', "'" + p);
    for (const cs of [0, 1]) { g.eng.invalidate(); const got = shown(g.at(cs ? 'C2' : 'C1')), exp = jsMatch(t, p, cs); if (got !== exp) bad.push([t, p, cs, got, exp]); }
  }
  same('regex matches as JavaScript (' + cases.length * 2 + ' cases)', bad, []);
  // every UTF-16 code unit against JavaScript, for classes without case
  const h = book2({ C1: '=REGEXREPLACE(A1,B1,"",0,1)' }), classBad = [];

try {
  const SV = await import('./solver.js');
  const { seekRoot } = await import('./whatif.js');
  const close = (got, exp, label, tol = 1e-4) => {
    const ok = Array.isArray(exp) ? Array.isArray(got) && got.length === exp.length && got.every((v, i) => Math.abs(v - exp[i]) <= tol * Math.max(1, Math.abs(exp[i])))
      : Math.abs(got - exp) <= tol * Math.max(1, Math.abs(exp));
    results.push({ ok, f: 'solver ' + label, v: got, expected: exp });
  };
  const same = (got, exp, label) => results.push({ ok: JSON.stringify(got) === JSON.stringify(exp), f: 'solver ' + label, v: got, expected: exp });
  const P = (o) => ({ x0: new Array(o.n).fill(0), lb: new Array(o.n).fill(0), ub: new Array(o.n).fill(Infinity), isInt: new Array(o.n).fill(false), difGroups: [], sense: 1, ctype: [], ...o });
  const opt = { ...SV.DEFAULT_OPTIONS, intTolerance: 0 };

  // Wyndor Glass (Hillier & Lieberman): max 3x + 5y, x ≤ 4, 2y ≤ 12, 3x + 2y ≤ 18 → (2, 6), z = 36
  const wy = P({ n: 2, sense: -1, ctype: ['le', 'le', 'le'], evaluate: (x) => ({ f: 3 * x[0] + 5 * x[1], g: [x[0] - 4, 2 * x[1] - 12, 3 * x[0] + 2 * x[1] - 18] }) });
  let r = await SV.simplexLP(wy, opt);
  same(r.status, 'found', 'LP status'); close(r.x, [2, 6], 'LP optimum');
  close(r.sensitivity.gDuals.map((d) => -d), [0, 1.5, 1], 'LP shadow prices');
  close(r.sensitivity.gRange[1], [6, 6], 'LP RHS ranging');
  close(r.sensitivity.costRange[0], [4.5, 3], 'LP cost ranging (as minimization)');
  const lim = SV.variableLimits(wy, r.x, r.linear);
  close([lim[0].lower, lim[0].objLower, lim[0].upper, lim[0].objUpper], [0, 30, 2, 36], 'limits');
  // equalities: x + 2y = 4, 3x + y = 7 → (2, 1)
  r = await SV.simplexLP(P({ n: 2, ctype: ['eq', 'eq'], evaluate: (x) => ({ f: x[0] + x[1], g: [x[0] + 2 * x[1] - 4, 3 * x[0] + x[1] - 7] }) }), opt);
  close(r.x, [2, 1], 'LP equalities');
  // free variable with a lower bound below zero
  r = await SV.simplexLP(P({ n: 1, lb: [-5], evaluate: (x) => ({ f: x[0], g: [] }) }), opt);
  close(r.x, [-5], 'LP negative bound');
  // Beale's cycling example: max .75x1 − 20x2 + .5x3 − 6x4 → 1.25
  r = await SV.simplexLP(P({ n: 4, sense: -1, ctype: ['le', 'le', 'le'], evaluate: (x) => ({ f: 0.75 * x[0] - 20 * x[1] + 0.5 * x[2] - 6 * x[3], g: [0.25 * x[0] - 8 * x[1] - x[2] + 9 * x[3], 0.5 * x[0] - 12 * x[1] - 0.5 * x[2] + 3 * x[3], x[2] - 1] }) }), opt);
  close(0.75 * r.x[0] - 20 * r.x[1] + 0.5 * r.x[2] - 6 * r.x[3], 1.25, 'LP degenerate (no cycling)');
  same((await SV.simplexLP(P({ n: 1, ctype: ['ge', 'le'], evaluate: (x) => ({ f: x[0], g: [x[0] - 5, x[0] - 3] }) }), opt)).status, 'infeasible', 'LP infeasible');
  same((await SV.simplexLP(P({ n: 1, sense: -1, evaluate: (x) => ({ f: x[0], g: [] }) }), opt)).status, 'unbounded', 'LP unbounded');
  same((await SV.simplexLP(P({ n: 1, lb: [-Infinity], evaluate: (x) => ({ f: x[0] * x[0], g: [] }) }), opt)).status, 'linearity', 'LP linearity check');
  // integer: max 5x + 4y, 6x + 4y ≤ 24, x + 2y ≤ 6 → (4, 0)
  const ip = P({ n: 2, sense: -1, isInt: [true, true], ctype: ['le', 'le'], evaluate: (x) => ({ f: 5 * x[0] + 4 * x[1], g: [6 * x[0] + 4 * x[1] - 24, x[0] + 2 * x[1] - 6] }) });
  close((await SV.simplexLP(ip, opt)).x, [4, 0], 'integer (LP)');
  close((await SV.grg(ip, opt)).x, [4, 0], 'integer (GRG)');
  // binary knapsack → a, c, d
  r = await SV.simplexLP(P({ n: 4, sense: -1, ub: [1, 1, 1, 1], isInt: [true, true, true, true], ctype: ['le'], evaluate: (x) => ({ f: 10 * x[0] + 13 * x[1] + 7 * x[2] + 8 * x[3], g: [4 * x[0] + 6 * x[1] + 3 * x[2] + 5 * x[3] - 12] }) }), opt);
  close(r.x, [1, 0, 1, 1], 'binary knapsack');
  // AllDifferent: min Σ c·x with x a permutation of 1..5 → largest values on the smallest costs
  const c5 = [5, 1, 4, 2, 3];
  const dif = P({ n: 5, lb: [1, 1, 1, 1, 1], ub: [5, 5, 5, 5, 5], isInt: [true, true, true, true, true], difGroups: [[0, 1, 2, 3, 4]], evaluate: (x) => ({ f: x.reduce((s, v, i) => s + c5[i] * v, 0), g: [] }) });
  close((await SV.simplexLP(dif, opt)).x, [1, 5, 2, 4, 3], 'AllDifferent (LP)');
  close((await SV.evolutionary(dif, { ...opt, seed: 9, maxNoImprove: 3 })).x, [1, 5, 2, 4, 3], 'AllDifferent (Evolutionary)');
  // nonlinear with an active constraint: min (x−1)² + (y−2)², x + y ≤ 2 → (0.5, 1.5), multiplier −1
  r = await SV.grg(P({ n: 2, lb: [-Infinity, -Infinity], ctype: ['le'], evaluate: (x) => ({ f: (x[0] - 1) ** 2 + (x[1] - 2) ** 2, g: [x[0] + x[1] - 2] }) }), opt);
  close(r.x, [0.5, 1.5], 'GRG constrained', 1e-5); close(r.sensitivity.multipliers[0], -1, 'GRG Lagrange multiplier', 1e-4);
  r = await SV.grg(P({ n: 2, lb: [-Infinity, -Infinity], ctype: ['eq'], evaluate: (x) => ({ f: x[0] ** 2 + x[1] ** 2, g: [x[0] + x[1] - 1] }) }), opt);
  close(r.x, [0.5, 0.5], 'GRG equality', 1e-5);
  r = await SV.grg(P({ n: 2, x0: [-1.2, 1], lb: [-Infinity, -Infinity], evaluate: (x) => ({ f: 100 * (x[1] - x[0] ** 2) ** 2 + (1 - x[0]) ** 2, g: [] }) }), opt);
  close(r.x, [1, 1], 'GRG Rosenbrock', 1e-3);
  r = await SV.grg(P({ n: 1, x0: [3], lb: [2.7], ub: [7.5], evaluate: (x) => ({ f: Math.sin(x[0]) + Math.sin(10 * x[0] / 3), g: [] }) }), { ...opt, multistart: true, population: 20, seed: 3 });
  close(r.x, [5.145735], 'GRG Multistart global optimum', 1e-4); same(r.status, 'global', 'Multistart status');
  same((await SV.grg(P({ n: 1, lb: [-Infinity], evaluate: (x) => ({ f: x[0], g: [] }) }), { ...opt, multistart: true })).status, 'bounds', 'Multistart requires bounds');
  r = await SV.evolutionary(P({ n: 2, lb: [-10, -10], ub: [10, 10], evaluate: (x) => ({ f: Math.abs(x[0] - 3) + Math.abs(x[1] + 1), g: [] }) }), { ...opt, seed: 7, maxNoImprove: 3 });
  close(r.x, [3, -1], 'Evolutionary non-smooth', 1e-3);
  // regression: infeasibility must not hide behind one large right side (x ≤ 1e8, x ≥ 3, x ≤ 1)
  same((await SV.simplexLP(P({ n: 1, sense: -1, ctype: ['le', 'ge', 'le'], evaluate: (x) => ({ f: x[0], g: [x[0] - 1e8, x[0] - 3, x[0] - 1] }) }), opt)).status, 'infeasible', 'LP infeasible with a large right side');
  // regression: redundant equal rows (x + y = 2 twice, 2x + 2y = 4) are not a reason to fail
  r = await SV.simplexLP(P({ n: 2, ctype: ['eq', 'eq', 'eq'], evaluate: (x) => ({ f: x[0], g: [x[0] + x[1] - 2, x[0] + x[1] - 2, 2 * x[0] + 2 * x[1] - 4] }) }), opt);
  same(r.status, 'found', 'LP redundant rows'); close(r.x, [0, 2], 'LP redundant rows optimum');
  // regression: free variable ranging (Max x, x ≤ 4, x free): user increase 1E+30, decrease 1 → as minimization [1E+30, 1]
  r = await SV.simplexLP(P({ n: 1, sense: -1, lb: [-Infinity], ctype: ['le'], evaluate: (x) => ({ f: x[0], g: [x[0] - 4] }) }), opt);
  close(r.x, [4], 'LP free variable'); close(r.sensitivity.costRange[0], [1e30, 1], 'LP free variable cost ranging');
  // free variable that ends up negative (Min x, x ≥ −3): the basic column is the mirrored twin
  r = await SV.simplexLP(P({ n: 1, lb: [-Infinity], ctype: ['ge'], evaluate: (x) => ({ f: x[0], g: [x[0] + 3] }) }), opt);
  close(r.x, [-3], 'LP free variable negative'); close(r.sensitivity.costRange[0], [1, 1e30], 'LP negative free variable ranging');
  // GRG: constraints are measured relative to their size (x + y = 1e6) and infeasible models are reported as such
  r = await SV.grg(P({ n: 2, lb: [-Infinity, -Infinity], ctype: ['eq'], evaluate: (x) => ({ f: (x[0] - 1) ** 2 + (x[1] - 1) ** 2, g: [x[0] + x[1] - 1e6], lhs: [x[0] + x[1]] }) }), opt);
  close(r.x, [5e5, 5e5], 'GRG large equality', 1e-6);
  same((await SV.grg(P({ n: 1, lb: [-Infinity], ctype: ['ge', 'le'], evaluate: (x) => ({ f: x[0] ** 2, g: [x[0] - 1, x[0] - 0.5] }) }), opt)).status, 'infeasible', 'GRG infeasible');
  // second review: dependent equality rows with large right sides (coefficients must not pick up round-off)
  const blend = (c, a, total, sh) => P({ n: 4, ctype: ['eq', 'eq', 'eq'], evaluate: (x) => {
    const r1 = a.reduce((s, v, i) => s + v * x[i], 0), r2 = a.reduce((s, v, i) => s + (1 - v) * x[i], 0), r3 = x.reduce((s, v) => s + v, 0);
    const lhs = [r1, r2, r3], rhs = [sh * total, (1 - sh) * total, total];
    return { f: c.reduce((s, v, i) => s + v * x[i], 0), g: lhs.map((l, k) => l - rhs[k]), lhs, rhs };
  } });
  r = await SV.simplexLP(blend([4, 4, 1, 4], [0.1, 0.78, 0.93, 0.61], 1e8, 0.27), opt);
  same(r.status, 'found', 'LP dependent rows, large right sides: status');
  close(4 * r.x[0] + 4 * r.x[1] + r.x[2] + 4 * r.x[3], 338554216.867, 'LP dependent rows, large right sides: optimum', 1e-7);
  r = await SV.simplexLP(blend([6, 7, 5, 9], [0.69, 0.77, 0.22, 0.62], 1e8, 0.25), opt);
  close(6 * r.x[0] + 7 * r.x[1] + 5 * r.x[2] + 9 * r.x[3], 506382978.72, 'LP dependent rows: not a worse vertex', 1e-7);
  // GRG must not stop while a multiplier sits on a slack row: Min 3x + 2y, x + y ≥ 10, start (50, 50) → (0, 10)
  r = await SV.grg(P({ n: 2, x0: [50, 50], ctype: ['ge'], evaluate: (x) => ({ f: 3 * x[0] + 2 * x[1], g: [x[0] + x[1] - 10], lhs: [x[0] + x[1]], rhs: [10] }) }), opt);
  close(r.x, [0, 10], 'GRG complementarity', 1e-5);
  r = await SV.grg(P({ n: 3, x0: [8, 19, 18], ub: [20, 20, 20], ctype: ['ge'], evaluate: (x) => ({ f: 6 * x[0] + x[1] + x[2], g: [2 * x[0] + x[1] + 4 * x[2] - 25] }) }), opt);
  close(6 * r.x[0] + r.x[1] + r.x[2], 6.25, 'GRG complementarity 3 variables', 1e-5);
  // Integer Optimality is relative also for objectives below 1 (default 1%)
  r = await SV.simplexLP(P({ n: 2, sense: -1, ub: [1, 1], isInt: [true, true], ctype: ['le'], evaluate: (x) => ({ f: 0.003 * x[0] + 0.002 * x[1], g: [x[0] + x[1] - 1.5] }) }), { ...SV.DEFAULT_OPTIONS });
  close(r.x, [1, 0], 'integer optimality is relative');
  // Evolutionary keeps the bounds of AllDifferent members (A1 = 1) and the 1..N meaning
  r = await SV.evolutionary(P({ n: 4, x0: [1, 2, 3, 4], lb: [1, 1, 1, 1], ub: [1, 4, 4, 4], isInt: [true, true, true, true], difGroups: [[0, 1, 2, 3]], evaluate: (x) => ({ f: -10 * x[0] + x[1] + 2 * x[2] + 3 * x[3], g: [] }) }), { ...opt, seed: 4, maxNoImprove: 2 });
  close(r.x, [1, 4, 3, 2], 'Evolutionary AllDifferent with a bound');
  r = await SV.evolutionary(P({ n: 3, x0: [0, 1, 2], lb: [1, 1, 1], ub: [3, 3, 3], isInt: [true, true, true], difGroups: [[0, 1, 2]], evaluate: (x) => ({ f: x[0] + x[1] + x[2], g: [] }) }), { ...opt, seed: 4, maxNoImprove: 2 });
  same(r.x.slice().sort(), [1, 2, 3], 'Evolutionary AllDifferent start outside 1..N');
  same((await SV.evolutionary(P({ n: 1, lb: [2], ub: [1], evaluate: (x) => ({ f: x[0], g: [] }) }), opt)).status, 'infeasible', 'Evolutionary conflicting bounds');
  // GRG scaling: tiny objectives and constraint rows in small units
  r = await SV.grg(P({ n: 2, lb: [-Infinity, -Infinity], evaluate: (x) => ({ f: 1e-8 * ((x[0] - 3) ** 2 + (x[1] + 1) ** 2), g: [] }) }), opt);
  close(r.x, [3, -1], 'GRG tiny objective', 1e-4);
  const S3 = [[0.04, 0.006, 0.002], [0.006, 0.01, 0.001], [0.002, 0.001, 0.0025]].map((row) => row.map((v) => v / 250)), mu3 = [0.12, 0.08, 0.05].map((v) => v / 250);
  r = await SV.grg(P({ n: 3, x0: [1 / 3, 1 / 3, 1 / 3], ctype: ['eq', 'ge'], evaluate: (w) => {
    let v = 0; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) v += w[i] * S3[i][j] * w[j];
    const lhs = [w[0] + w[1] + w[2], mu3.reduce((s, m, i) => s + m * w[i], 0)], rhs = [1, 0.08 / 250];
    return { f: v, g: lhs.map((l, k) => l - rhs[k]), lhs, rhs };
  } }), opt);
  close(r.x, [0.2285, 0.4669, 0.3046], 'GRG Markowitz in daily units', 2e-3);
  same((await SV.grg(P({ n: 1, lb: [-Infinity], sense: -1, evaluate: (x) => ({ f: x[0], g: [] }) }), opt)).status, 'unbounded', 'GRG unbounded');
  // Goal Seek root finding
  close((await seekRoot((x) => x ** 3 + x - 10, 1)).x, 2, 'Goal Seek cubic', 1e-9);
  close((await seekRoot((x) => Math.exp(x) - 100, 0)).x, Math.log(100), 'Goal Seek exp', 1e-9);
} catch (e) { results.push({ ok: false, f: 'solver tests', v: 'threw ' + e.message + ' ' + e.stack, expected: '' }); }

const fails = results.filter((r) => !r.ok);
document.getElementById('sum').innerHTML = `<b class="${fails.length ? 'fail' : 'ok'}">${results.length - fails.length} / ${results.length} passed</b>`;
document.getElementById('out').textContent = fails.map((r) => `FAIL ${r.f}\n   got ${JSON.stringify(r.v)}  expected ${JSON.stringify(r.expected)}`).join('\n');
window.__results = { total: results.length, fails };
</script>
</body>
</html>
